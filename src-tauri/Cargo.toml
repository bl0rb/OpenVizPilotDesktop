[package]
name = "openvizpilot-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.10"
# reqwest 0.13 defaults to rustls; we keep the OS TLS stack and certificate store
# (corporate CAs) plus the system proxy settings, as before -- and the updater
# plugin uses the same stack, so no second TLS implementation ends up in the binary.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
